<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 490" role="img" aria-labelledby="title desc">
<title id="title">Product Manager and Forward Deployed Engineer role paths</title>
<desc id="desc">Illustrative comparison: Product Management moves from user need to product decision, team alignment, and learning. Forward Deployed Engineering moves from customer workflow to technical solution, deployment, and adoption learning. Not measured data.</desc>
<rect width="960" height="490" rx="24" fill="#fffdf8"/><text x="50" y="57" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#b84f2c" letter-spacing="2">ROLE PATHS · CONCEPT</text>
<text x="50" y="106" font-family="Georgia,serif" font-size="34" fill="#14252c">How each path turns a need into learning</text>
<text x="50" y="162" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#b84f2c">PRODUCT MANAGEMENT</text>
<g font-family="Arial,sans-serif" font-size="16" fill="#14252c" text-anchor="middle">
<rect x="50" y="185" width="190" height="72" rx="12" fill="#f5f2ea"/><text x="145" y="228">User need</text>
<text x="258" y="230" fill="#b84f2c" font-size="25">→</text>
<rect x="276" y="185" width="190" height="72" rx="12" fill="#efd981"/><text x="371" y="228">Product choice</text>
<text x="484" y="230" fill="#b84f2c" font-size="25">→</text>
<rect x="502" y="185" width="190" height="72" rx="12" fill="#c6ded2"/><text x="597" y="228">Team alignment</text>
<text x="710" y="230" fill="#b84f2c" font-size="25">→</text>
<rect x="728" y="185" width="182" height="72" rx="12" fill="#f5f2ea"/><text x="819" y="228">Learning</text>
<text x="50" y="321" text-anchor="start" font-size="18" font-weight="700" fill="#3d6d7d">FORWARD DEPLOYED ENGINEERING</text>
<rect x="50" y="344" width="190" height="72" rx="12" fill="#f5f2ea"/><text x="145" y="387">Customer workflow</text>
<text x="258" y="389" fill="#3d6d7d" font-size="25">→</text>
<rect x="276" y="344" width="190" height="72" rx="12" fill="#adc8d0"/><text x="371" y="387">Technical solution</text>
<text x="484" y="389" fill="#3d6d7d" font-size="25">→</text>
<rect x="502" y="344" width="190" height="72" rx="12" fill="#c6ded2"/><text x="597" y="387">Deployment</text>
<text x="710" y="389" fill="#3d6d7d" font-size="25">→</text>
<rect x="728" y="344" width="182" height="72" rx="12" fill="#f5f2ea"/><text x="819" y="387">Adoption learning</text>
</g><text x="50" y="458" font-family="Arial,sans-serif" font-size="13" fill="#45606a">Illustrative synthesis of linked employer postings · not a measured workflow or market statistic</text></svg>